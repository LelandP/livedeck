[package]
name = "livedeck"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Real video through libmpv. Off by default so the workspace builds without a system libmpv
# See crates/player/README.md for the setup.
default = []
mpv = ["htpc-player/mpv"]
# Generated captions with whisper.cpp. Needs CMake and a C++ compiler to build.
# Off by default: without it the player menu's Captions row says "Captions unavailable" (--mock
# still has scripted captions).
captions = ["htpc-captions/whisper"]
# whisper.cpp on the GPU through Vulkan (Linux, the Steam Deck): the menu offers the Best quality.
vulkan = ["captions", "htpc-captions/vulkan"]

[dependencies]
htpc-core.workspace = true
htpc-input.workspace = true
htpc-ui.workspace = true
htpc-twitch-api.workspace = true
htpc-storage.workspace = true
htpc-resolver.workspace = true
htpc-player.workspace = true
htpc-chat.workspace = true
htpc-kick-api.workspace = true
htpc-captions.workspace = true
# `unstable-winit-030` for the window's focus events (pausing when another app is in front).
# It pins the exact Slint version through the workspace's `slint = "1.18.1"`.
slint = { workspace = true, features = ["unstable-winit-030"] }
tokio.workspace = true
# `buffered`: Kick favorites are looked up a few at a time.
futures-util = { workspace = true, features = ["alloc"] }
pico-args.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
open.workspace = true
# The captions' speech models are downloaded on first use and checked with their SHA-256.
reqwest.workspace = true
sha2.workspace = true
# A video's seek-preview storyboard description (`…-info.json`).
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true

[dev-dependencies]
# Paused time, for the sleep timer tests.
tokio = { workspace = true, features = ["test-util"] }
wiremock.workspace = true
tempfile.workspace = true
