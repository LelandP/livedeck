name: Release

# Push a tag like v0.1.0 (it must match `version` in the root Cargo.toml) and this builds the
# packages and publishes them on the repository's Releases page. "Run workflow" builds the same
# packages as downloadable artifacts of the run without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The bundled downloads, pinned: release tag and the archive's SHA-256 (checked 2026-11-15 against
  # GitHub's asset digests and the copies in deps\). To update, change both together.
  MPV_TAG: "20261106"  # libmpv: shinchiro/mpv-winbuild-cmake, mpv-dev-x86_64-20261106-git-9028187538.7z
  MPV_SHA256: "b5a3cc91b5dabf88ad5bb21d000834da4fd0bbda30f4584d39c082127bd62414"
  STREAMLINK_TAG: "8.6.3-1"  # Streamlink: streamlink/windows-builds, streamlink-8.6.3-1-py315-x86_64.zip
  STREAMLINK_SHA256: "3b1f1470d4b135080a8107ca2917379ca3ff5acadbcdc215568b79eea1450497"

# Read-only by default. The publish job below asks for contents: write itself.
permissions:
  contents: read

jobs:
  windows:
    name: Windows portable zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Name and version
        id: ver
        shell: pwsh
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $name = $env:GITHUB_REF_NAME
            if ($name -ne "v$cargo") { throw "Tag $name does not match Cargo.toml version $cargo. Bump the version first." }
          } else {
            $name = "v$cargo-dev$env:GITHUB_RUN_NUMBER"
          }
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Download libmpv and Streamlink
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force deps\mpv, deps\streamlink | Out-Null
          # Stops the build if a pinned archive is not the one checked in (a release replaced, say).
          function Assert-Hash($pattern, $want) {
            $files = @(Get-ChildItem $pattern)
            if ($files.Count -ne 1) { throw "expected one file for $pattern, found $($files.Count)" }
            $got = (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash.ToLower()
            if ($got -ne $want) { throw "$($files[0].Name): SHA-256 $got, expected $want" }
          }
          # Prebuilt libmpv (x86-64, not the "v3" CPU-specific one). The package has only the DLL and a MinGW
          # import library, so mpv.lib for MSVC is generated from the DLL.
          gh release download $env:MPV_TAG --repo shinchiro/mpv-winbuild-cmake --pattern 'mpv-dev-x86_64-2*' --dir deps\mpv
          Assert-Hash deps\mpv\mpv-dev-x86_64-2*.7z $env:MPV_SHA256
          Push-Location deps\mpv; tar -xf (Get-ChildItem mpv-dev-x86_64-2*.7z).Name; Pop-Location
          ./packaging/windows/make-import-lib.ps1 -Dir deps\mpv
          # Portable Streamlink with its own Python.
          gh release download $env:STREAMLINK_TAG --repo streamlink/windows-builds --pattern 'streamlink-*-x86_64.zip' --dir deps\streamlink
          Assert-Hash deps\streamlink\streamlink-*-x86_64.zip $env:STREAMLINK_SHA256
          Expand-Archive (Get-ChildItem deps\streamlink\*.zip).FullName deps\streamlink\x
          $sl = Get-ChildItem deps\streamlink\x -Directory | Select-Object -First 1
          "STREAMLINK_DIR=$($sl.FullName)" >> $env:GITHUB_ENV
          "MPV_LIB_DIR=$((Resolve-Path deps\mpv).Path)" >> $env:GITHUB_ENV

      # CMake, LLVM/libclang and the ggml speed flags for the captions feature (whisper.cpp).
      - uses: ./.github/actions/whisper-windows

      - name: Build
        # CPU only on Windows. The speech models are downloaded by the app, not packaged.
        run: cargo build --release --locked -p livedeck --features mpv,captions

      - name: Package
        shell: pwsh
        run: |
          ./packaging/windows/package.ps1 `
            -Exe target\release\livedeck.exe `
            -MpvDll deps\mpv\libmpv-2.dll `
            -StreamlinkDir $env:STREAMLINK_DIR `
            -Version "${{ steps.ver.outputs.name }}" `
            -OutDir dist

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/*.zip
          if-no-files-found: error

  # Linux and the Steam Deck: the Flatpak bundle.
  flatpak:
    uses: ./.github/workflows/flatpak.yml

  publish:
    name: Publish release
    needs: [windows, flatpak]
    # A broken Linux build must not hold back the Windows release.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history and tags, so the notes can list the commits since the previous release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      # The release notes: install instructions, then "What's new" and "Bugs fixed", then every
      # commit since the previous v* tag (subject as a bullet, the commit body under it), newest
      # first. Merge commits and version bumps are left out. The first release lists the whole
      # history.
      #
      # The two summary sections come from commit message lines that start with "New:" or
      # "Fixed:" (one change per line, written for players, not developers), e.g.
      #   New: Audio only in the player menu.
      #   Fixed: The side menu opened behind the Settings page.
      # A section with no such lines is left out.
      - name: Write the release notes
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          # Measured from the last full release: release candidates (v1.0.0-rc.1) are skipped, so
          # an RC and the final release both list everything since the version before.
          prev=$(git describe --tags --abbrev=0 --match 'v*' --exclude '*-*' "$tag^" 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..$tag"; else range="$tag"; fi
          # Oldest first, so the summary reads in the order things were done.
          bodies=$(git log --no-merges --reverse --format='%b' "$range" | tr -d '\r')
          new=$(printf '%s\n' "$bodies" | sed -n 's/^[[:space:]]*New:[[:space:]]*/- /p')
          fixed=$(printf '%s\n' "$bodies" | sed -n 's/^[[:space:]]*Fixed:[[:space:]]*/- /p')
          {
            cat <<'EOF'
          **Windows:** download the `LiveDeck-*-windows-x64.zip`, unpack it anywhere and run `livedeck.exe`. Nothing else to install (video and Streamlink are included). Captions download their speech model the first time you turn them on. Windows may show a SmartScreen warning because the program is not code-signed.

          **Linux / Steam Deck:** download the `.flatpak` (if it is attached to this release) and run `flatpak install --user LiveDeck-*.flatpak`. To update, open the new file in Discover (or GNOME Software), or run the same command with `--reinstall`. Settings and sign-in are kept.
          LiveDeck is an unofficial Twitch client and finds streams through unofficial endpoints, which can break and may conflict with Twitch's terms of service. See the README.

          EOF
            if [ -n "$new" ]; then
              printf "## What's new\n\n%s\n\n" "$new"
            fi
            if [ -n "$fixed" ]; then
              printf '## Bugs fixed\n\n%s\n\n' "$fixed"
            fi
            printf '## All changes\n\n'
            # %w(0,2,2) indents the body under its bullet without rewrapping it. Version bumps
            # ("Release 0.1.1") are left out: the release itself says that.
            git log --no-merges --invert-grep --grep='^Release [0-9]' \
              --format='- %s (%h)%n%n%w(0,2,2)%b' "$range"
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog:** $REPO_URL/compare/$prev...$tag"
            fi
          } > release-notes.md
          cat release-notes.md
      - name: Rename the Flatpak bundle
        run: |
          if [ -f dist/livedeck.flatpak ]; then
            mv dist/livedeck.flatpak "dist/LiveDeck-${GITHUB_REF_NAME}-linux-x86_64.flatpak"
          fi
          ls -l dist
      - name: Write SHA256SUMS
        run: |
          # sha256sum format over every file in dist/ (the sums file itself excluded), so users can run sha256sum -c.
          (cd dist && find . -type f ! -name SHA256SUMS -printf '%P\0' | sort -z | xargs -0 sha256sum) > dist/SHA256SUMS
          cat dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # v0.1.0-rc1 and the like are marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Written by "Write the release notes" above. GitHub's generated notes are left off: they
          # list merged pull requests, and changes here land as plain commits.
          body_path: release-notes.md
